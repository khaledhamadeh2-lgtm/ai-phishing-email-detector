services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      PHISHGUARD_ALLOWED_ORIGINS: http://localhost:8080
      PHISHGUARD_MODEL_PATH: models/phishguard-v1.joblib
    read_only: true
    tmpfs:
      - /tmp
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api
